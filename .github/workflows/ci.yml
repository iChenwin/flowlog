name: Windows quality and preview release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
      - name: Enforce installer size and generate SHA-256 report
        shell: pwsh
        run: ./scripts/check-bundle.ps1
      - name: Install, launch, close and uninstall smoke test
        shell: pwsh
        run: ./scripts/smoke-install.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flowlog-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/package-report.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowlog-windows-nsis
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/package-report.json
          fail_on_unmatched_files: true
          body: |
            FlowLog preview release. Back up your vault and try a copy first.
            Requires the system Microsoft Edge WebView2 runtime; the installer does not bundle it.
            See package-report.json for installer bytes and SHA-256. CI smoke checks process startup only.
            IME, clean-machine installation, migration and long-session editing require separate manual verification.
