name: Verify existing installer on native Windows
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Run containing the already built NSIS artifact'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ensure the installer uses identical product sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          $sourceSha = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" --jq .head_sha
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve build source commit' }
          git diff --exit-code $sourceSha HEAD -- src src-tauri/src src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/capabilities src-tauri/icons package.json package-lock.json vite.config.ts tsconfig.json index.html
          if ($LASTEXITCODE -ne 0) { throw 'Product sources differ: a fresh build is required' }
          Write-Output "Verified product sources match build $env:BUILD_RUN ($sourceSha)"
      - uses: actions/download-artifact@v4
        with:
          name: flowlog-windows-nsis
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: .
      - name: Verify the downloaded installer checksum
        shell: pwsh
        run: |
          $report = @(Get-Content artifacts/package-report.json -Raw | ConvertFrom-Json)[0]
          $file = Get-Item (Join-Path src-tauri/target/release/bundle/nsis $report.file)
          if (-not $report.passed -or $file.Length -ne $report.bytes -or (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $report.sha256) { throw 'Installer verification failed' }
      - run: npm ci
      - name: Native save, reopening, conflict and uninstall verification
        run: ./scripts/smoke-install.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flowlog-windows-nsis-verified
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/Cargo.lock
            artifacts/package-report.json
            artifacts/native-smoke.json
            artifacts/native-smoke.png
